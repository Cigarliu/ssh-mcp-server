# SSH MCP Server Configuration

server:
  name: "ssh-mcp-server"
  version: "1.0.0"

ssh:
  default_port: 22
  timeout: 30s
  keepalive_interval: 30s

session:
  max_sessions: 100
  max_sessions_per_host: 10
  idle_timeout: 10m
  session_timeout: 30m
  cleanup_interval: 1m

sftp:
  max_file_size: 1073741824
  chunk_size: 4194304
  transfer_timeout: 5m

# core: 8 transport-neutral tools; files: core plus 2 SFTP tools; advanced: all 27 migration and diagnostic tools
tools:
  profile: core

# Serial devices are opened on demand with connection_open(transport="serial").
# On Linux, run the server as an account permitted to open the device (commonly
# the dialout group), or launch the service with the necessary device access.

# Predefined hosts for quick connection
# You can reference these hosts by name with connection_open(hostname="prod").
# connection_list returns the saved host names without exposing credentials.
hosts:
  prod:
    host: "192.168.1.100"
    port: 22
    username: "root"
    password: "your-password"
    description: "Production server"

  staging:
    host: "staging.example.com"
    port: 22
    username: "deploy"
    private_key_path: "~/.ssh/id_rsa"
    description: "Staging environment"

  # Host management tools are available only with tools.profile: advanced.
  # Example: ssh_save_host(name="dev", host="dev.local", username="dev", password="secret")

logging:
  level: info  # debug, info, warn, error
  format: console  # json, console
  output: stderr  # stdout is reserved for MCP protocol messages
