name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    - name: Verify module files
      run: |
        go mod tidy
        git diff --exit-code -- go.mod go.sum

    - name: Build server
      run: go build ./cmd/server

    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test -race ./...
